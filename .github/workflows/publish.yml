name: Publish

# Pattern B (GitFlow):
#   - Push to release/**  -> RC publish (e.g. 2.0.0-rc.42)
#   - Tag v*              -> stable publish (e.g. 2.0.0)
#
# A single workflow file is required by NuGet Trusted Publishing — the policy
# matches on the exact filename.
on:
  push:
    branches: ['release/**']
    tags: ['v*']

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGE_PROJECT: AspectCentral.DispatchProxy/AspectCentral.DispatchProxy.csproj
  SOLUTION: AspectCentral.DispatchProxy.sln
  STABLE_BRANCH: master  # branch from which `v*` tags must be cut

jobs:
  publish-rc:
    name: Build, Sign, Publish RC
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: windows-latest  # Required: Azure code-signing clients (sign / Trusted Signing) call Windows-only APIs.
    environment: release

    permissions:
      id-token: write   # Required for OIDC (NuGet/login + azure/login)
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Determine RC version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          PREFIX=$(grep -oE '<VersionPrefix>[^<]+' "$PACKAGE_PROJECT" | head -1 | sed 's|<VersionPrefix>||')
          if [ -z "${PREFIX:-}" ]; then
            echo "::error::Could not determine VersionPrefix from $PACKAGE_PROJECT"
            exit 1
          fi
          VERSION="${PREFIX}-rc.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION (rc) from $PACKAGE_PROJECT"

      - name: Restore
        run: dotnet restore $env:SOLUTION

      - name: Build
        env:
          CI: 'true'
        run: dotnet build $env:SOLUTION --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test $env:SOLUTION --configuration Release --no-build

      - name: Pack
        shell: bash
        run: |
          dotnet pack "$PACKAGE_PROJECT" \
            --configuration Release \
            --no-build \
            --output ./artifacts \
            -p:Version=${{ steps.version.outputs.version }}

      # ----- Azure Trusted Signing -----
      # Federated credential on UAMI required:
      #   Subject: repo:jamesconsultingllc/AspectCentral.DispatchProxy:environment:release
      #   Issuer:  https://token.actions.githubusercontent.com
      #   Audience: api://AzureADTokenExchange
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install dotnet sign
        shell: pwsh
        run: |
          dotnet tool install --global sign --version ${{ vars.SIGN_TOOL_VERSION || '0.9.1-beta.24469.1' }}

      - name: Sign nupkg(s)
        shell: pwsh
        run: |
          sign code trusted-signing `
            --trusted-signing-account "${{ vars.TRUSTED_SIGNING_ACCOUNT }}" `
            --certificate-profile "${{ vars.TRUSTED_SIGNING_PROFILE }}" `
            --endpoint "${{ vars.TRUSTED_SIGNING_ENDPOINT }}" `
            --base-directory "$(Get-Location)\artifacts" `
            "*.nupkg"

      # ----- NuGet Trusted Publishing (OIDC, no API key) -----
      - name: NuGet login (OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}  # nuget.org profile NAME, not email

      - name: Push to nuget.org
        shell: bash
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Upload signed package artifact
        uses: actions/upload-artifact@v4
        with:
          name: published-${{ steps.version.outputs.version }}
          path: ./artifacts/*.nupkg
          retention-days: 90

  publish-stable:
    name: Build, Sign, Publish Stable
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    environment: release

    permissions:
      id-token: write
      contents: write  # Required by softprops/action-gh-release on stable tags. RC publishes do not receive this permission.

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Determine stable version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          PREFIX=$(grep -oE '<VersionPrefix>[^<]+' "$PACKAGE_PROJECT" | head -1 | sed 's|<VersionPrefix>||')
          if [ -z "${PREFIX:-}" ]; then
            echo "::error::Could not determine VersionPrefix from $PACKAGE_PROJECT"
            exit 1
          fi

          if [[ ! "${GITHUB_REF}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Stable tags must match v<MAJOR>.<MINOR>.<PATCH> exactly. Got: ${GITHUB_REF#refs/tags/}"
            exit 1
          fi

          VERSION="${GITHUB_REF#refs/tags/v}"
          if [ "$VERSION" != "$PREFIX" ]; then
            echo "::error::Stable tag v$VERSION must match $PACKAGE_PROJECT VersionPrefix ($PREFIX)."
            exit 1
          fi

          # Tags must point at a commit on $STABLE_BRANCH so we cannot accidentally ship an untested SHA.
          git fetch origin "$STABLE_BRANCH" --depth=0 >/dev/null 2>&1 || git fetch origin "$STABLE_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$STABLE_BRANCH"; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} points at $GITHUB_SHA which is not on origin/$STABLE_BRANCH. Stable tags must be cut from $STABLE_BRANCH."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION (stable) from $PACKAGE_PROJECT"

      - name: Restore
        run: dotnet restore $env:SOLUTION

      - name: Build
        env:
          CI: 'true'
        run: dotnet build $env:SOLUTION --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test $env:SOLUTION --configuration Release --no-build

      - name: Pack
        shell: bash
        run: |
          dotnet pack "$PACKAGE_PROJECT" \
            --configuration Release \
            --no-build \
            --output ./artifacts \
            -p:Version=${{ steps.version.outputs.version }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install dotnet sign
        shell: pwsh
        run: |
          dotnet tool install --global sign --version ${{ vars.SIGN_TOOL_VERSION || '0.9.1-beta.24469.1' }}

      - name: Sign nupkg(s)
        shell: pwsh
        run: |
          sign code trusted-signing `
            --trusted-signing-account "${{ vars.TRUSTED_SIGNING_ACCOUNT }}" `
            --certificate-profile "${{ vars.TRUSTED_SIGNING_PROFILE }}" `
            --endpoint "${{ vars.TRUSTED_SIGNING_ENDPOINT }}" `
            --base-directory "$(Get-Location)\artifacts" `
            "*.nupkg"

      - name: NuGet login (OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        shell: bash
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Upload signed package artifact
        uses: actions/upload-artifact@v4
        with:
          name: published-${{ steps.version.outputs.version }}
          path: ./artifacts/*.nupkg
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: ./artifacts/*.nupkg
