name: CI

# GitFlow Pattern B — single workflow file (required so NuGet Trusted
# Publishing can match on a stable filename).
#
#   - Push to any tracked branch / PR / workflow_dispatch -> build-test only
#   - Push to release/**                                  -> build-test + publish-rc
#                                                            (version: <prefix>-rc.<run_number>)
#   - Push tag v*                                         -> build-test + publish-stable
#                                                            (version: <prefix>; tag must equal csproj VersionPrefix
#                                                             AND commit must be reachable from the stable branch)
on:
  push:
    branches: [develop, main, master, 'feature/**', 'release/**', 'hotfix/**']
    tags:     ['v*']
  pull_request:
    branches: [develop, main, master]
  workflow_dispatch:

# Cancel stale runs on branch pushes; never cancel a tag publish mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read
  pull-requests: read

env:
  PACKAGE_PROJECT: AspectCentral.DispatchProxy/AspectCentral.DispatchProxy.csproj
  SOLUTION: AspectCentral.DispatchProxy.sln
  STABLE_BRANCH: master  # branch from which v* tags must be cut

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Always-on gating job. Fast feedback loop on Linux for every push/PR/tag.
  # ─────────────────────────────────────────────────────────────────────────
  build-test:
    name: Build, Test, Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0  # Sonar requires full history for blame / new-code detection

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Setup Java (Sonar scanner requires JRE)
        if: ${{ vars.SONAR_PROJECT_KEY != '' }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore
        run: dotnet restore "$SOLUTION"

      - name: Install Sonar scanner
        if: ${{ vars.SONAR_PROJECT_KEY != '' }}
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin Sonar analysis
        if: ${{ vars.SONAR_PROJECT_KEY != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"${{ vars.SONAR_PROJECT_KEY }}" \
            /o:"${{ vars.SONAR_ORG }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.coverage.exclusions="**/*Tests/**,**/*.Tests/**"

      - name: Build
        env:
          CI: 'true'  # activates ContinuousIntegrationBuild for deterministic source paths
        run: dotnet build "$SOLUTION" --configuration Release --no-restore

      - name: Test (with coverage)
        run: |
          dotnet test "$SOLUTION" \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: End Sonar analysis
        if: ${{ vars.SONAR_PROJECT_KEY != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Pack (preview, for artifact only)
        # CI suffix prevents accidental consumption of an unpublished build.
        # publish-rc / publish-stable below produce the real signed packages.
        run: |
          dotnet pack "$PACKAGE_PROJECT" \
            --configuration Release \
            --no-build \
            --output ./artifacts \
            -p:VersionSuffix="ci.${{ github.run_number }}"

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg-${{ github.run_number }}
          path: ./artifacts/*.nupkg
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ github.run_number }}
          path: '**/TestResults/**/*.trx'
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # RC publish — release/** branches only. Only runs after build-test passes.
  # ─────────────────────────────────────────────────────────────────────────
  publish-rc:
    name: Sign & Publish RC
    needs: build-test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    runs-on: windows-latest  # Azure code-signing clients (sign / Trusted Signing) call Windows-only APIs.
    environment: release

    permissions:
      id-token: write   # Required for OIDC (azure/login + NuGet/login)
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Determine RC version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          PREFIX=$(grep -oE '<VersionPrefix>[^<]+' "$PACKAGE_PROJECT" | head -1 | sed 's|<VersionPrefix>||')
          if [ -z "${PREFIX:-}" ]; then
            echo "::error::Could not determine VersionPrefix from $PACKAGE_PROJECT"
            exit 1
          fi
          VERSION="${PREFIX}-rc.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION (rc) from $PACKAGE_PROJECT"

      - name: Restore
        run: dotnet restore $env:SOLUTION

      - name: Build
        env:
          CI: 'true'
        run: dotnet build $env:SOLUTION --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Pack
        shell: bash
        run: |
          dotnet pack "$PACKAGE_PROJECT" \
            --configuration Release \
            --no-build \
            --output ./artifacts \
            -p:Version=${{ steps.version.outputs.version }}

      # ----- Azure Trusted Signing -----
      # Federated credential required on the Entra app behind AZURE_CLIENT_ID:
      #   Subject:  repo:jamesconsultingllc/AspectCentral.DispatchProxy:environment:release
      #   Issuer:   https://token.actions.githubusercontent.com
      #   Audience: api://AzureADTokenExchange
      - name: Azure login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install dotnet sign
        shell: pwsh
        run: dotnet tool install --global sign --version ${{ vars.SIGN_TOOL_VERSION || '0.9.1-beta.24469.1' }}

      - name: Sign nupkg(s)
        shell: pwsh
        run: |
          sign code trusted-signing `
            --trusted-signing-endpoint "${{ vars.TRUSTED_SIGNING_ENDPOINT }}" `
            --trusted-signing-account "${{ vars.TRUSTED_SIGNING_ACCOUNT }}" `
            --trusted-signing-certificate-profile "${{ vars.TRUSTED_SIGNING_PROFILE }}" `
            --base-directory "$(Get-Location)\artifacts" `
            "*.nupkg"

      - name: Extract signing leaf cert
        id: extract-cert
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $nupkg = Get-ChildItem .\artifacts\*.nupkg | Select-Object -First 1
          if (-not $nupkg) { throw "No signed .nupkg found in .\artifacts" }
          $zip = [System.IO.Compression.ZipFile]::OpenRead($nupkg.FullName)
          try {
            $entry = $zip.GetEntry('.signature.p7s')
            if (-not $entry) { throw "No .signature.p7s in $($nupkg.Name) — package was not signed" }
            $ms = New-Object System.IO.MemoryStream
            $s  = $entry.Open(); $s.CopyTo($ms); $s.Dispose()
            $sigBytes = $ms.ToArray()
          } finally { $zip.Dispose() }
          $cms = New-Object System.Security.Cryptography.Pkcs.SignedCms
          $cms.Decode($sigBytes)
          $leaf = $cms.SignerInfos[0].Certificate
          $ver = '${{ steps.version.outputs.version }}'
          $cerPath = ".\artifacts\signing-cert-$ver.cer"
          [System.IO.File]::WriteAllBytes($cerPath, $leaf.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
          $fp = $leaf.GetCertHashString('SHA256')
          Write-Host "Leaf cert    : $($leaf.Subject)"
          Write-Host "SHA-256      : $fp"
          Write-Host "NotBefore    : $($leaf.NotBefore.ToString('o'))"
          Write-Host "NotAfter     : $($leaf.NotAfter.ToString('o'))"
          Write-Host "Wrote        : $cerPath"
          "fingerprint=$fp" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "cer-path=$cerPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          @"
          ## Signing certificate

          | Field    | Value |
          |----------|-------|
          | Subject  | $($leaf.Subject) |
          | Issuer   | $($leaf.Issuer) |
          | SHA-256  | ``$fp`` |
          | Valid    | $($leaf.NotBefore.ToString('u')) → $($leaf.NotAfter.ToString('u')) |

          If nuget.org rejects the package with a fingerprint mismatch, register the
          ``signing-cert-$ver`` artifact (the ``.cer`` file) at https://www.nuget.org/account/Certificates.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # ----- NuGet Trusted Publishing (OIDC, no API key) -----
      # NUGET_USER must be the nuget.org USERNAME of the trust-policy CREATOR.
      - name: NuGet login (OIDC)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        shell: bash
        run: |
          set -euo pipefail
          # `dotnet nuget push` does not expand globs and bash does not
          # expand them inside double quotes — enumerate explicitly with
          # `compgen -G` (which handles "no matches" without erroring under
          # `set -e`) and push each file individually. `--skip-duplicate`
          # keeps the job idempotent across retries.
          mapfile -t NUPKGS < <(compgen -G "./artifacts/*.nupkg" || true)
          if [ "${#NUPKGS[@]}" -eq 0 ]; then
            echo "::error::No .nupkg files found in ./artifacts to push."
            exit 1
          fi
          for pkg in "${NUPKGS[@]}"; do
            dotnet nuget push "$pkg" \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Upload signed package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-${{ steps.version.outputs.version }}
          path: |
            ./artifacts/*.nupkg
          retention-days: 90

      - name: Upload signing certificate artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signing-cert-${{ steps.version.outputs.version }}
          path: ./artifacts/signing-cert-*.cer
          retention-days: 90  # GitHub Actions caps public-repo retention at 90 days; private repos may extend up to 400 via repo settings

  # ─────────────────────────────────────────────────────────────────────────
  # Stable publish — only on v* tags. Verifies tag matches csproj VersionPrefix
  # and that the tagged commit is reachable from $STABLE_BRANCH.
  # ─────────────────────────────────────────────────────────────────────────
  publish-stable:
    name: Sign & Publish Stable
    needs: build-test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    environment: release

    permissions:
      id-token: write
      contents: write  # Required by softprops/action-gh-release. RC job does not get this.

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Determine stable version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          PREFIX=$(grep -oE '<VersionPrefix>[^<]+' "$PACKAGE_PROJECT" | head -1 | sed 's|<VersionPrefix>||')
          if [ -z "${PREFIX:-}" ]; then
            echo "::error::Could not determine VersionPrefix from $PACKAGE_PROJECT"
            exit 1
          fi

          if [[ ! "${GITHUB_REF}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Stable tags must match v<MAJOR>.<MINOR>.<PATCH> exactly. Got: ${GITHUB_REF#refs/tags/}"
            exit 1
          fi

          VERSION="${GITHUB_REF#refs/tags/v}"
          if [ "$VERSION" != "$PREFIX" ]; then
            echo "::error::Stable tag v$VERSION must match $PACKAGE_PROJECT VersionPrefix ($PREFIX)."
            exit 1
          fi

          # Tag commit must be on $STABLE_BRANCH so we cannot ship an untested SHA.
          git fetch origin "$STABLE_BRANCH" --depth=0 >/dev/null 2>&1 || git fetch origin "$STABLE_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$STABLE_BRANCH"; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} points at $GITHUB_SHA which is not on origin/$STABLE_BRANCH. Stable tags must be cut from $STABLE_BRANCH."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION (stable) from $PACKAGE_PROJECT"

      - name: Restore
        run: dotnet restore $env:SOLUTION

      - name: Build
        env:
          CI: 'true'
        run: dotnet build $env:SOLUTION --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Pack
        shell: bash
        run: |
          dotnet pack "$PACKAGE_PROJECT" \
            --configuration Release \
            --no-build \
            --output ./artifacts \
            -p:Version=${{ steps.version.outputs.version }}

      - name: Azure login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install dotnet sign
        shell: pwsh
        run: dotnet tool install --global sign --version ${{ vars.SIGN_TOOL_VERSION || '0.9.1-beta.24469.1' }}

      - name: Sign nupkg(s)
        shell: pwsh
        run: |
          sign code trusted-signing `
            --trusted-signing-endpoint "${{ vars.TRUSTED_SIGNING_ENDPOINT }}" `
            --trusted-signing-account "${{ vars.TRUSTED_SIGNING_ACCOUNT }}" `
            --trusted-signing-certificate-profile "${{ vars.TRUSTED_SIGNING_PROFILE }}" `
            --base-directory "$(Get-Location)\artifacts" `
            "*.nupkg"

      - name: Extract signing leaf cert
        id: extract-cert
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $nupkg = Get-ChildItem .\artifacts\*.nupkg | Select-Object -First 1
          if (-not $nupkg) { throw "No signed .nupkg found in .\artifacts" }
          $zip = [System.IO.Compression.ZipFile]::OpenRead($nupkg.FullName)
          try {
            $entry = $zip.GetEntry('.signature.p7s')
            if (-not $entry) { throw "No .signature.p7s in $($nupkg.Name) — package was not signed" }
            $ms = New-Object System.IO.MemoryStream
            $s  = $entry.Open(); $s.CopyTo($ms); $s.Dispose()
            $sigBytes = $ms.ToArray()
          } finally { $zip.Dispose() }
          $cms = New-Object System.Security.Cryptography.Pkcs.SignedCms
          $cms.Decode($sigBytes)
          $leaf = $cms.SignerInfos[0].Certificate
          $ver = '${{ steps.version.outputs.version }}'
          $cerPath = ".\artifacts\signing-cert-$ver.cer"
          [System.IO.File]::WriteAllBytes($cerPath, $leaf.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
          $fp = $leaf.GetCertHashString('SHA256')
          Write-Host "Leaf cert    : $($leaf.Subject)"
          Write-Host "SHA-256      : $fp"
          Write-Host "NotBefore    : $($leaf.NotBefore.ToString('o'))"
          Write-Host "NotAfter     : $($leaf.NotAfter.ToString('o'))"
          Write-Host "Wrote        : $cerPath"
          "fingerprint=$fp" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "cer-path=$cerPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          @"
          ## Signing certificate

          | Field    | Value |
          |----------|-------|
          | Subject  | $($leaf.Subject) |
          | Issuer   | $($leaf.Issuer) |
          | SHA-256  | ``$fp`` |
          | Valid    | $($leaf.NotBefore.ToString('u')) → $($leaf.NotAfter.ToString('u')) |

          If nuget.org rejects the package with a fingerprint mismatch, register the
          ``signing-cert-$ver`` artifact (the ``.cer`` file) at https://www.nuget.org/account/Certificates.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: NuGet login (OIDC)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t NUPKGS < <(compgen -G "./artifacts/*.nupkg" || true)
          if [ "${#NUPKGS[@]}" -eq 0 ]; then
            echo "::error::No .nupkg files found in ./artifacts to push."
            exit 1
          fi
          for pkg in "${NUPKGS[@]}"; do
            dotnet nuget push "$pkg" \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Upload signed package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-${{ steps.version.outputs.version }}
          path: |
            ./artifacts/*.nupkg
          retention-days: 90

      - name: Upload signing certificate artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signing-cert-${{ steps.version.outputs.version }}
          path: ./artifacts/signing-cert-*.cer
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            ./artifacts/*.nupkg
            ./artifacts/signing-cert-*.cer
