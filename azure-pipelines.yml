# Build, test, sign, and publish AspectCentral.DispatchProxy.
# Signing uses Azure Artifact Signing (formerly Trusted Signing) via workload-identity
# federation — no client secrets. See docs/azure-artifact-signing-setup.md in
# gh-misc-tools for the full setup walkthrough.

trigger:
- master

pool:
  vmImage: 'windows-latest'

steps:
# SonarCloud analysis is temporarily disabled — the SonarCloud service connection
# token expired (401 from sonarcloud.io). Re-enable after rotating the token in
# both SonarCloud (Account → Security) and the ADO 'Aspect Central' service
# connection. Tasks were also bumped from @1 (deprecated) to @3 — keep @3 when
# uncommenting.
# - task: SonarCloudPrepare@3
#   inputs:
#     SonarQube: 'Aspect Central'
#     organization: 'james-consulting-llc'
#     scannerMode: 'dotnet'
#     projectKey: 'jamesconsultingllc_AspectCentral.DispatchProxy'
#     projectVersion: '$(Version)'
- task: DotNetCoreCLI@2
  inputs:
    command: 'restore'
    feedsToUse: 'select'    
- task: DotNetCoreCLI@2
  displayName: 'dotnet build'
  env:
    CI: 'true'   # activates ContinuousIntegrationBuild for deterministic, normalized source paths
  inputs:
    command: 'build'
    projects: 'AspectCentral.DispatchProxy.sln'
    arguments: '--configuration $(buildConfiguration) --no-restore'
- task: DotNetCoreCLI@2
  displayName: 'dotnet test'
  inputs:
    command: test
    projects: '**/*.Tests/*.csproj'
    arguments: '--configuration $(buildConfiguration) --collect "Code coverage"'
- task: DotNetCoreCLI@2
  inputs:
    command: 'pack'
    packagesToPack: '**/AspectCentral.DispatchProxy.csproj'
    nobuild: true
    versioningScheme: 'byEnvVar'
    versionEnvVar: Version
    arguments: '--configuration $(buildConfiguration)'
- task: ArtifactSigning@1
  displayName: 'Sign nupkg with Azure Artifact Signing'
  inputs:
    AzureServiceConnectionName: 'jc-azure-signing'
    Endpoint: 'https://wcus.codesigning.azure.net/'
    ArtifactSigningAccountName: 'jc-ts-account'
    CertificateProfileName: 'Code-Signing'
    FilesFolder: '$(Build.SourcesDirectory)'
    FilesFolderFilter: 'nupkg'
    FilesFolderRecurse: true
    FileDigest: 'SHA256'
    TimestampRfc3161: 'http://timestamp.acs.microsoft.com'
    TimestampDigest: 'SHA256'
# - task: SonarCloudAnalyze@3
# - task: SonarCloudPublish@3
#   inputs:
#     pollingTimeoutSec: '300'
- task: CopyFiles@2
  displayName: 'Copy Files to: $(build.artifactstagingdirectory)'
  inputs:
    Contents: '**\bin\$(buildConfiguration)\*.nupkg'
    TargetFolder: '$(build.artifactstagingdirectory)'
- task: PublishBuildArtifacts@1
  displayName: 'Publish Artifact: drop'

